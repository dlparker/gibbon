[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gibbon"
version = "0.1.0"

description = "Intent tree traversal for LMM assistant"
#readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dennis Parker", email = "dennis@windhavengroup.com" }
]


dependencies = [
    "sqlmodel>=0.0.31",
]
[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=7.0.0",
]
